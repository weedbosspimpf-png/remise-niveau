# Blueprint Render : API Fastify + PostgreSQL en un seul déploiement.
# Sur render.com : "New" -> "Blueprint" -> connecter ce dépôt -> Render lit ce
# fichier automatiquement -> "Apply".
#
# Voir docs/05-deploiement.md pour les étapes détaillées (y compris le
# raccordement du front déployé sur Vercel).

databases:
  - name: edu-restart-db
    plan: free
    databaseName: edu_restart
    user: edu_restart

services:
  - type: web
    name: edu-restart-api
    runtime: node
    plan: free
    region: frankfurt
    # À adapter si ce code est fusionné sur une autre branche par défaut.
    branch: claude/tender-pascal-sahhft
    # npm install -g pnpm (plutôt que corepack) : corepack a un bug connu de
    # vérification de signature ("Cannot find matching keyid") sur certains
    # environnements de build, y compris Render au moment où ceci a été écrit.
    buildCommand: npm install -g pnpm@10.33.0 && pnpm install --frozen-lockfile && pnpm --filter @edu-restart/api exec prisma generate
    # Le seed est inclus ici (plutôt que lancé une fois via le Shell Render)
    # car l'accès Shell n'est pas disponible sur le plan Free. Sans danger de
    # le relancer à chaque démarrage : prisma/seed.ts n'utilise que des
    # upsert, donc c'est un no-op après la première exécution.
    startCommand: npm install -g pnpm@10.33.0 && pnpm --filter @edu-restart/api exec prisma migrate deploy && pnpm --filter @edu-restart/api run prisma:seed && pnpm --filter @edu-restart/api run start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: edu-restart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
