<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Logo Hortan</title>
<style>
  :root { --bg: #0b0820; }
  * { margin: 0; box-sizing: border-box; }
  body { background: transparent; font-family: "Inter Display", "Inter", sans-serif; }
  .lock { display: inline-flex; align-items: center; gap: 40px; padding: 40px; }
  .lock img { width: 260px; height: 260px; }
  .txt b { display: block; font-weight: 900; font-size: 150px; letter-spacing: -.035em; line-height: .9; }
  .txt span { display: block; font-weight: 700; font-size: 44px; letter-spacing: .32em; margin-top: 16px; }
  .clair b { color: #fff; } .clair span { color: #22d3ee; }
  .sombre b { color: #0b0820; } .sombre span { color: #7c3aed; }
  .pile { display: inline-flex; flex-direction: column; align-items: center; gap: 36px; padding: 40px; text-align: center; }
  .pile img { width: 300px; height: 300px; }
</style></head>
<body>
  <div id="horizontal-clair" class="lock clair"><img src="logo-icone.svg"><div class="txt"><b>HORTAN</b><span>INTELLIGENCE PLUS</span></div></div><br>
  <div id="horizontal-sombre" class="lock sombre"><img src="logo-icone.svg"><div class="txt"><b>HORTAN</b><span>INTELLIGENCE PLUS</span></div></div><br>
  <div id="vertical-clair" class="pile clair"><img src="logo-icone.svg"><div class="txt"><b>HORTAN</b><span>INTELLIGENCE PLUS</span></div></div>
  <div id="vertical-sombre" class="pile sombre"><img src="logo-icone.svg"><div class="txt"><b>HORTAN</b><span>INTELLIGENCE PLUS</span></div></div>
</body></html>
